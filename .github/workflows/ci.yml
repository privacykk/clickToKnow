name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建
        run: swift build

      - name: 单元测试
        run: swift test

      - name: 打包冒烟（ad-hoc 签名，验证 package.sh 全流程）
        run: ./Scripts/package.sh
        env:
          VERSION: ci-${{ github.sha }}
