name: Release

# 打 tag 即出安装包：tag 名去掉可选的 v 前缀作为版本号，产物挂到该 tag 的 Release。
# 已有的 ci.yml 只覆盖分支推送，不会因 tag 触发，因此发布流程独立在这里。
on:
  push:
    tags:
      # 用 ** 全量匹配再在第一步校验版本号格式：tag 过滤器只保证 * / ** 语义可靠，
      # 写成 '[0-9]*' 这类字符类在过滤器里未必生效，会导致 tag 推上来却静默不触发。
      - '**'

permissions:
  contents: write # 创建 Release、上传附件需要写权限

jobs:
  # 发布前必须验证同一提交能构建并通过测试：tag 推送不会触发 ci.yml（它只覆盖分支推送），
  # 此前等于「未测试的提交直接进 Release」。verify 失败则 build-release 不会执行。
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 构建
        run: swift build

      - name: 单元测试
        run: swift test

  build-release:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag 版本号
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 接受 1.0.0 / v1.0.0 / 1.0.0-beta.1 这类语义化版本，其余 tag 不发布
          if ! [[ "$TAG" =~ ^v?[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag '$TAG' 不是版本号形式，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: 构建并打包（ad-hoc 签名）
        if: steps.meta.outputs.skip == 'false'
        env:
          # VERSION 必须传：package.sh 不读 tag，缺了会退回脚本内的默认版本（0.2.1）
          VERSION: ${{ steps.meta.outputs.version }}
          # 关闭时间戳后缀（默认 APPEND_TIMESTAMP=1），使产物名为 ClickToKnow-<版本>.dmg/.zip
          APPEND_TIMESTAMP: '0'
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/package.sh

      - name: 校验产物完整性
        if: steps.meta.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # 产物名由 package.sh 决定（APPEND_TIMESTAMP=0 时确定），先断言存在且非空，
          # 避免把空文件/半截文件发到 Release
          for ext in dmg zip; do
            f="dist/ClickToKnow-${VERSION}.${ext}"
            [ -f "$f" ] || { echo "缺少产物：$f" >&2; ls -l dist >&2; exit 1; }
            [ -s "$f" ] || { echo "产物为空：$f" >&2; exit 1; }
            ls -lh "$f"
          done
          # DMG 结构自检（不挂载）：损坏的磁盘映像不应上传
          hdiutil verify "dist/ClickToKnow-${VERSION}.dmg" >/dev/null && echo "DMG 结构校验通过"

      - name: 上传构建产物
        if: steps.meta.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ClickToKnow-${{ steps.meta.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: 创建 Release 并附加安装包
        if: steps.meta.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # tag 名来自外部输入：只经环境变量传入并在前面校验过格式，这里再挡一次选项注入
          TAG="${GITHUB_REF_NAME}"
          [[ -n "$TAG" && "$TAG" != -* ]] || { echo "非法 tag 名：$TAG" >&2; exit 1; }

          NOTES="### 安装说明

          - 下载 \`ClickToKnow-${VERSION}.dmg\`，拖入「应用程序」即可。
          - **打开应用**。本安装包使用 ad-hoc 签名，未经 Apple 公证。确认下载来源后，若 macOS 提示无法验证开发者，到「系统设置 → 隐私与安全性」点「仍要打开」。
          - **全局划词**。在「系统设置 → 隐私与安全性 → 辅助功能」中授权 ClickToKnow。升级后如显示授权失效，在「状态总览」点「修复授权」。
          - **大模型密钥**。升级后钥匙串可能需要重新授权。在「大模型」编辑对应配置并点「授权访问密钥」。授权前仍可使用系统词典。"

          FILES=(dist/*.dmg dist/*.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑时不先清空附件（那会留下一段「Release 里没有安装包」的空窗）：
            # 先用 --clobber 覆盖同名产物，再删掉不属于本次产物的过期附件。
            echo "Release 已存在，覆盖同名产物后清理过期附件"
            gh release upload "$TAG" "${FILES[@]}" --clobber

            # 期望附件名 = 本次产物的文件名；其余（旧版本号遗留）逐个删除
            for FILE in "${FILES[@]}"; do
              basename "$FILE"
            done | sort > expected-assets.txt
            gh release view "$TAG" --json assets --jq '.assets[].name' | sort > current-assets.txt
            comm -13 expected-assets.txt current-assets.txt > stale-assets.txt
            if [ -s stale-assets.txt ]; then
              while IFS= read -r ASSET; do
                [ -n "$ASSET" ] || continue
                echo "删除过期附件：$ASSET"
                gh release delete-asset "$TAG" "$ASSET" --yes
              done < stale-assets.txt
            fi

            # 该 tag 曾被删除再重建时，GitHub 会把原 Release 转成草稿（草稿对外不可见），
            # 这里显式发布；对已发布的 Release 是无副作用的空操作
            gh release edit "$TAG" --draft=false
          else
            gh release create "$TAG" \
              --title "ClickToKnow ${VERSION}" \
              --notes "$NOTES" \
              "${FILES[@]}"
          fi
